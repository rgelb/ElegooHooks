name: Build installer and portable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, 1.0.0)
        required: true
        default: 1.0.0
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, test, package, and release
    runs-on: windows-2025-vs2026
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
              throw "Version '$version' is invalid. Use a numeric version such as 1.0.0."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install Inno Setup with exit code $LASTEXITCODE."
          }

      - name: Build native bridge and .NET projects
        run: .\scripts\build.ps1 -Configuration Release

      - name: Build installer
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: .\scripts\build-installer.ps1 -Version $env:RELEASE_VERSION -SkipBuild

      - name: Build portable application
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $publishDirectory = Join-Path $env:GITHUB_WORKSPACE `
              "src\ElegooLink.Desktop\bin\Release\net10.0-windows\publish\win-x64"
          $portableDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\portable"
          $portablePath = Join-Path $portableDirectory `
              "ElegooPrinterEvents-Portable-$env:RELEASE_VERSION-win-x64.zip"

          $requiredFiles = @(
              (Join-Path $publishDirectory "ElegooLink.Desktop.exe"),
              (Join-Path $publishDirectory "elegoo_link_bridge.dll")
          )
          foreach ($requiredFile in $requiredFiles) {
              if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
                  throw "The publish output is missing '$requiredFile'."
              }
          }

          New-Item -ItemType Directory -Force -Path $portableDirectory | Out-Null
          Push-Location $publishDirectory
          try {
              Compress-Archive `
                  -Path "*" `
                  -DestinationPath $portablePath `
                  -CompressionLevel Optimal
          }
          finally {
              Pop-Location
          }

          if (-not (Test-Path -LiteralPath $portablePath -PathType Leaf)) {
              throw "The portable package was not created at '$portablePath'."
          }

      - name: Smoke-test installer
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $installerPath = Join-Path $env:GITHUB_WORKSPACE `
              "artifacts\installer\ElegooPrinterEvents-Setup-$env:RELEASE_VERSION.exe"
          $installDirectory = Join-Path $env:RUNNER_TEMP `
              "ElegooPrinterEvents-$env:RELEASE_VERSION"

          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
              throw "The installer was not found at '$installerPath'."
          }

          $installArguments = @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART",
              "/NOICONS",
              ('/DIR="' + $installDirectory + '"')
          )

          $installProcess = Start-Process `
              -FilePath $installerPath `
              -ArgumentList $installArguments `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
              throw "The installer exited with code $($installProcess.ExitCode)."
          }

          $requiredFiles = @(
              (Join-Path $installDirectory "ElegooLink.Desktop.exe"),
              (Join-Path $installDirectory "elegoo_link_bridge.dll"),
              (Join-Path $installDirectory "unins000.exe")
          )
          foreach ($requiredFile in $requiredFiles) {
              if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
                  throw "The installed file '$requiredFile' is missing."
              }
          }

          $uninstallerPath = Join-Path $installDirectory "unins000.exe"
          $uninstallProcess = Start-Process `
              -FilePath $uninstallerPath `
              -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
              -Wait `
              -PassThru `
              -WindowStyle Hidden
          if ($uninstallProcess.ExitCode -ne 0) {
              throw "The uninstaller exited with code $($uninstallProcess.ExitCode)."
          }

          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $installDirectory); $attempt++) {
              Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $installDirectory) {
              throw "The uninstaller left the installation directory '$installDirectory'."
          }

      - name: Smoke-test portable application
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $portablePath = Join-Path $env:GITHUB_WORKSPACE `
              "artifacts\portable\ElegooPrinterEvents-Portable-$env:RELEASE_VERSION-win-x64.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP `
              "ElegooPrinterEvents-Portable-$env:RELEASE_VERSION"

          if (-not (Test-Path -LiteralPath $portablePath -PathType Leaf)) {
              throw "The portable package was not found at '$portablePath'."
          }

          Expand-Archive `
              -LiteralPath $portablePath `
              -DestinationPath $extractDirectory

          $requiredFiles = @(
              (Join-Path $extractDirectory "ElegooLink.Desktop.exe"),
              (Join-Path $extractDirectory "elegoo_link_bridge.dll")
          )
          foreach ($requiredFile in $requiredFiles) {
              if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
                  throw "The portable package is missing '$requiredFile' at its root."
              }
          }

      - name: Create SHA-256 checksums
        id: package
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          $installer = Get-Item -LiteralPath (
              Join-Path $env:GITHUB_WORKSPACE `
                  "artifacts\installer\ElegooPrinterEvents-Setup-$env:RELEASE_VERSION.exe"
          )
          $portable = Get-Item -LiteralPath (
              Join-Path $env:GITHUB_WORKSPACE `
                  "artifacts\portable\ElegooPrinterEvents-Portable-$env:RELEASE_VERSION-win-x64.zip"
          )
          $releaseDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\release"
          $checksumPath = Join-Path $releaseDirectory "SHA256SUMS.txt"
          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null

          $checksumLines = foreach ($asset in @($installer, $portable)) {
              $hash = Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256
              "$($hash.Hash.ToLowerInvariant())  $($asset.Name)"
          }
          $checksumLines |
              Set-Content -LiteralPath $checksumPath -Encoding ascii

          "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "portable_path=$($portable.FullName)" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ElegooPrinterEvents-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.package.outputs.installer_path }}
            ${{ steps.package.outputs.portable_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          INSTALLER_PATH: ${{ steps.package.outputs.installer_path }}
          PORTABLE_PATH: ${{ steps.package.outputs.portable_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          $installerName = Split-Path -Leaf $env:INSTALLER_PATH
          $portableName = Split-Path -Leaf $env:PORTABLE_PATH
          $releaseNotes = @"
          ## Deployment options

          This release provides two Windows x64 deployment options:

          ### Installer

          Download **$installerName** and run it. The setup application installs
          Elegoo Printer Events for the current Windows user and creates Start
          menu shortcuts.

          ### Portable application

          Download **$portableName**, unzip it, and run
          **ElegooLink.Desktop.exe**. No installation is required.

          Both deployments are self-contained and do not require a separate
          .NET installation.
          "@

          $arguments = @(
              "release",
              "create",
              $env:RELEASE_TAG,
              "$env:INSTALLER_PATH#Installer",
              "$env:PORTABLE_PATH#Portable application",
              "$env:CHECKSUM_PATH#SHA-256 checksums",
              "--repo",
              $env:GITHUB_REPOSITORY,
              "--target",
              $env:GITHUB_SHA,
              "--title",
              "Elegoo Printer Events $env:RELEASE_VERSION",
              "--notes",
              $releaseNotes,
              "--generate-notes"
          )
          if ($env:IS_PRERELEASE -eq "true") {
              $arguments += "--prerelease"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "GitHub CLI failed to create release '$env:RELEASE_TAG'."
          }
